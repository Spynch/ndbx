services:
  app:
    build:
      context: .
    env_file:
      - .env.local
    depends_on:
      redis:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
      mongos:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      neo4j-init:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT}:${APP_PORT}"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--port", "${REDIS_PORT}"]
    env_file:
      - .env.local
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p ${REDIS_PORT} ping | grep PONG"]
      interval: 2s
      timeout: 2s
      retries: 30

  cassandra-test:
    image: cassandra:5.0
    env_file:
      - .env.local
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME}
      CASSANDRA_NUM_TOKENS: ${CASSANDRA_NUM_TOKENS}
      MAX_HEAP_SIZE: ${CASSANDRA_MAX_HEAP_SIZE}
      HEAP_NEWSIZE: ${CASSANDRA_HEAP_NEWSIZE}
    ports:
      - "${CASSANDRA_PORT}:${CASSANDRA_PORT}"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh localhost ${CASSANDRA_PORT} -e \"DESCRIBE KEYSPACES\""]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  cassandra-init:
    image: cassandra:5.0
    env_file:
      - .env.local
    depends_on:
      cassandra-test:
        condition: service_healthy
    volumes:
      - ./cassandra:/scripts:ro
    command: ["bash", "/scripts/init-cassandra.sh"]
    restart: "no"

  neo4j:
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
    ports:
      - "${NEO4J_BOLT_PORT}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-a", "bolt://localhost:7687", "-u", "${NEO4J_USERNAME}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  neo4j-init:
    image: neo4j:5.24-community
    environment:
      NEO4J_URL: ${NEO4J_URL}
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./neo4j-init:/scripts:ro
    entrypoint: ["bash", "/scripts/init-neo4j.sh"]
    restart: "no"

  mongo-cfg-1:
    image: mongo:8.0
    command:
      - mongod
      - --configsvr
      - --replSet
      - ${MONGO_CFG_RS}
      - --port
      - ${MONGO_CFG_1_PORT}
      - --bind_ip_all
    volumes:
      - mongo-cfg-1-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host localhost --port ${MONGO_CFG_1_PORT} --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 2s
      timeout: 2s
      retries: 60

  mongo-cfg-2:
    image: mongo:8.0
    command:
      - mongod
      - --configsvr
      - --replSet
      - ${MONGO_CFG_RS}
      - --port
      - ${MONGO_CFG_2_PORT}
      - --bind_ip_all
    volumes:
      - mongo-cfg-2-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host localhost --port ${MONGO_CFG_2_PORT} --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 2s
      timeout: 2s
      retries: 60

  mongo-cfg-3:
    image: mongo:8.0
    command:
      - mongod
      - --configsvr
      - --replSet
      - ${MONGO_CFG_RS}
      - --port
      - ${MONGO_CFG_3_PORT}
      - --bind_ip_all
    volumes:
      - mongo-cfg-3-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host localhost --port ${MONGO_CFG_3_PORT} --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 2s
      timeout: 2s
      retries: 60

  mongo-shard1-1:
    image: mongo:8.0
    command:
      - mongod
      - --shardsvr
      - --replSet
      - ${MONGO_SHARD1_RS}
      - --port
      - ${MONGO_SHARD1_1_PORT}
      - --bind_ip_all
    volumes:
      - mongo-shard1-1-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host localhost --port ${MONGO_SHARD1_1_PORT} --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 2s
      timeout: 2s
      retries: 60

  mongo-shard1-2:
    image: mongo:8.0
    command:
      - mongod
      - --shardsvr
      - --replSet
      - ${MONGO_SHARD1_RS}
      - --port
      - ${MONGO_SHARD1_2_PORT}
      - --bind_ip_all
    volumes:
      - mongo-shard1-2-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host localhost --port ${MONGO_SHARD1_2_PORT} --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 2s
      timeout: 2s
      retries: 60

  mongo-shard1-3:
    image: mongo:8.0
    command:
      - mongod
      - --shardsvr
      - --replSet
      - ${MONGO_SHARD1_RS}
      - --port
      - ${MONGO_SHARD1_3_PORT}
      - --bind_ip_all
    volumes:
      - mongo-shard1-3-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host localhost --port ${MONGO_SHARD1_3_PORT} --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 2s
      timeout: 2s
      retries: 60

  mongo-shard2-1:
    image: mongo:8.0
    command:
      - mongod
      - --shardsvr
      - --replSet
      - ${MONGO_SHARD2_RS}
      - --port
      - ${MONGO_SHARD2_1_PORT}
      - --bind_ip_all
    volumes:
      - mongo-shard2-1-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host localhost --port ${MONGO_SHARD2_1_PORT} --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 2s
      timeout: 2s
      retries: 60

  mongo-shard2-2:
    image: mongo:8.0
    command:
      - mongod
      - --shardsvr
      - --replSet
      - ${MONGO_SHARD2_RS}
      - --port
      - ${MONGO_SHARD2_2_PORT}
      - --bind_ip_all
    volumes:
      - mongo-shard2-2-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host localhost --port ${MONGO_SHARD2_2_PORT} --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 2s
      timeout: 2s
      retries: 60

  mongo-shard2-3:
    image: mongo:8.0
    command:
      - mongod
      - --shardsvr
      - --replSet
      - ${MONGO_SHARD2_RS}
      - --port
      - ${MONGO_SHARD2_3_PORT}
      - --bind_ip_all
    volumes:
      - mongo-shard2-3-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host localhost --port ${MONGO_SHARD2_3_PORT} --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 2s
      timeout: 2s
      retries: 60

  mongos:
    image: mongo:8.0
    depends_on:
      mongo-cfg-1:
        condition: service_healthy
      mongo-cfg-2:
        condition: service_healthy
      mongo-cfg-3:
        condition: service_healthy
    command:
      - mongos
      - --configdb
      - ${MONGO_CFG_RS}/mongo-cfg-1:${MONGO_CFG_1_PORT},mongo-cfg-2:${MONGO_CFG_2_PORT},mongo-cfg-3:${MONGO_CFG_3_PORT}
      - --bind_ip_all
      - --port
      - ${MONGODB_PORT}
    ports:
      - "${MONGODB_PORT}:${MONGODB_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host localhost --port ${MONGODB_PORT} --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 2s
      timeout: 2s
      retries: 60

  mongo-init:
    image: mongo:8.0
    env_file:
      - .env.local
    depends_on:
      mongo-cfg-1:
        condition: service_healthy
      mongo-cfg-2:
        condition: service_healthy
      mongo-cfg-3:
        condition: service_healthy
      mongo-shard1-1:
        condition: service_healthy
      mongo-shard1-2:
        condition: service_healthy
      mongo-shard1-3:
        condition: service_healthy
      mongo-shard2-1:
        condition: service_healthy
      mongo-shard2-2:
        condition: service_healthy
      mongo-shard2-3:
        condition: service_healthy
      mongos:
        condition: service_started
    volumes:
      - ./mongo:/scripts:ro
    command: ["bash", "/scripts/init-mongo.sh"]
    restart: "no"

volumes:
  mongo-cfg-1-data:
  mongo-cfg-2-data:
  mongo-cfg-3-data:
  mongo-shard1-1-data:
  mongo-shard1-2-data:
  mongo-shard1-3-data:
  mongo-shard2-1-data:
  mongo-shard2-2-data:
  mongo-shard2-3-data:
  cassandra-data:
  neo4j-data:
